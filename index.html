<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangerine Review Club</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<script>try{var t=localStorage.getItem('bb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--o:#FF8A00;--od:#D95F00;--os:#FFF1E0;--line:#FFD9A8;--ink:#3A2210;--mut:#8A6A4D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1E140C;--o:#FF8A00;--od:#FF9A33;--os:#3A2412;--line:#5C3A1C;--ink:#FFE9D2;--mut:#C9A27F}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#1E140C;--o:#FF8A00;--od:#FF9A33;--os:#3A2412;--line:#5C3A1C;--ink:#FFE9D2;--mut:#C9A27F}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg)}
#tg{background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;max-width:760px;margin:0 auto;padding:0 18px 40px;min-height:100vh}
#tg *{box-sizing:border-box}
#tg h1,#tg h2,#tg h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.1}
#tg button,#tg input,#tg select,#tg textarea{font:inherit;color:inherit}
#tg :focus-visible{outline:3px solid var(--od);outline-offset:2px}
#tg .top{display:flex;align-items:center;gap:20px;padding:26px 0 14px;flex-wrap:wrap}
#tg .top .grow{flex:1 1 220px}
#tg .top h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;color:var(--od)}
#tg .top p{margin:6px 0 0;color:var(--mut)}
#tg .logo{width:96px;height:96px;flex:none;margin-top:12px;object-fit:contain}
#tg .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
#tg .who{display:flex;align-items:center;gap:8px;background:var(--os);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-weight:700;color:var(--od)}
#tg .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#FFB84D,#FF8A00);flex:none;width:34px;height:34px;font-size:18px}
#tg .av.lg{width:84px;height:84px;font-size:44px}
#tg .av.sm{width:26px;height:26px;font-size:14px}
#tg .panel{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:22px}
#tg .panel h2{font-size:1.25rem;margin-bottom:10px;color:var(--od)}
#tg .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){#tg .row{grid-template-columns:1fr}}
#tg label{display:block;font-size:.85rem;font-weight:700;color:var(--mut);margin:10px 0 4px}
#tg input,#tg select,#tg textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
#tg textarea{min-height:100px;resize:vertical}
#tg .hint{font-size:.85rem;color:var(--mut);margin:6px 0 0}
#tg .stars{display:flex;gap:2px}
#tg .stars button{background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--line);padding:0 2px;line-height:1}
#tg .stars button{filter:grayscale(1);opacity:.35}#tg .stars button.on{filter:none;opacity:1}
#tg .avpick{display:flex;gap:6px;flex-wrap:wrap}
#tg .avpick button{border:2px solid var(--line);background:var(--bg);border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
#tg .avpick button[aria-pressed="true"]{border-color:var(--o);background:var(--os);box-shadow:0 0 0 2px var(--o)}
#tg .btn{background:var(--o);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
#tg .btn:hover{filter:brightness(1.12)}
#tg .btn.ghost{background:var(--os);color:var(--od)}
#tg .btn.danger{background:var(--bg);color:#B3261E;border:2px solid #F2C4C0}
#tg .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#tg .chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500}
#tg .chip[aria-pressed="true"]{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}
#tg .post{background:var(--bg);border:2px solid var(--line);border-left:8px solid var(--o);border-radius:6px 18px 18px 6px;padding:18px;margin-bottom:18px}
#tg .post h3{font-size:1.4rem}
#tg .open{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:1.4rem;font-weight:800;line-height:1.1;color:var(--ink)}
#tg .open:hover{color:var(--od);text-decoration:underline}
#tg .meta{color:var(--mut);font-size:.9rem;margin:8px 0 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#tg .link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:var(--od);display:inline-flex;align-items:center;gap:6px}
#tg .link:hover{text-decoration:underline}
#tg .tag{background:var(--os);border-radius:999px;padding:1px 10px;font-weight:700;color:var(--od);font-size:.82rem}
#tg .rate{color:var(--o);letter-spacing:2px}
#tg .body{white-space:pre-wrap;max-width:68ch}
#tg .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#tg .act{background:var(--os);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--od)}
#tg .act[aria-pressed="true"]{background:var(--o);color:#fff}
#tg .act[data-a="like"][aria-pressed="true"]{background:var(--os);color:var(--od);box-shadow:inset 0 0 0 2px var(--o)}
#tg .tl.off{filter:grayscale(1);opacity:.55}
#tg .comments{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
#tg .cm{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
#tg .cform{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#tg .cform input{flex:1 1 140px}
#tg .empty{text-align:center;color:var(--mut);padding:24px 0}
#tg .phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#tg .phead h2{font-size:1.8rem;color:var(--od);margin:0}
#tg .stats{display:flex;gap:18px;margin-top:8px;color:var(--mut);flex-wrap:wrap}
#tg .stats b{color:var(--od);font-size:1.15rem}
#tg .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#tg .toast.show{opacity:1}
#tg .theme{margin-left:auto;align-self:flex-start;margin-top:26px;background:var(--os);color:var(--od);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
#tg .tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
#tg .topcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--os)}
#tg .topcard h3{font-size:1.05rem;color:var(--od);margin-bottom:6px}
#tg .topcard ol{margin:0;padding-left:20px}
#tg .tblwrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;margin-bottom:22px}
#tg .mtable{border-collapse:collapse;width:100%;font-size:.92rem;white-space:nowrap}
#tg .mtable th,#tg .mtable td{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:middle}
#tg .mtable th{background:var(--os);color:var(--od);font-weight:700;position:sticky;top:0}
#tg .mtable tr:last-child td{border-bottom:0}
#tg .mtable th:last-child,#tg .mtable td:last-child{border-right:0}
#tg .mtable .nocopy{user-select:none;-webkit-user-select:none}
#tg .mtable .btn{padding:4px 12px;font-size:.85rem}
#tg .bingo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%}
#tg .bc{display:flex;align-items:center;justify-content:center;text-align:center;min-height:72px;padding:4px 3px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.7rem;line-height:1.2;font-weight:600;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;min-width:0}
#tg button.bc{cursor:pointer}
#tg .blist{display:grid;gap:6px}
#tg .bl{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.3;font-weight:600}
#tg button.bl{cursor:pointer}
#tg .bl .bx{flex:none;width:26px;height:26px;border:2px solid var(--o);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;line-height:1}
#tg .bl .bn{color:var(--mut);font-weight:700}
#tg .bl.on{background:var(--o);border-color:var(--o);color:#3A2210;font-weight:700}
#tg .bl.on .bx{background:#3A2210;border-color:#3A2210;color:#fff}
#tg .bl.on .bn{color:#3A2210}
#tg .bl.free{background:#FFD08A;border-color:#FFD08A;color:#3A2210;font-weight:700}
#tg .bl.free .bx{background:#3A2210;border-color:#3A2210;color:#fff}
#tg .bc{position:relative}
#tg .bc.on{background:var(--o);border-color:var(--o);color:#3A2210;font-weight:700}
#tg .bc.free{background:#FFD08A;border-color:#FFD08A;color:#3A2210;font-weight:700}
#tg .bc.on::before{content:"\2713";position:absolute;top:1px;left:4px;font-size:.65rem;line-height:1}
@media(max-width:400px){#tg .bc{font-size:.66rem;padding:10px 1px 3px;min-height:68px;hyphens:manual;-webkit-hyphens:manual}}
@media(min-width:480px){#tg .bingo{gap:6px}#tg .bc{min-height:88px;font-size:.82rem;padding:6px 5px}}
@media(min-width:640px){#tg .bingo{gap:8px}#tg .bc{aspect-ratio:1;min-height:0;font-size:1rem;padding:8px;border-radius:12px}}
#tg .person{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px}
</style>
</head>
<body>

<div id="tg">
  <header class="top">
    <img class="logo" src="/logo.png" alt="Tangerine Review Club logo" width="96" height="96">
    <div class="grow"><h1>Tangerine Review Club</h1><p>A juicy review is a good review. Sign up, post a slice, and share what you watch, read and play.</p></div>
    <button class="theme" id="theme-btn" type="button"></button>
  </header>
  <div id="tg-app"><p class="empty">Loading...</p></div>
  <div class="toast" id="tg-toast" role="status"></div>
</div>

<script>
(function(){
const app=document.getElementById('tg-app');
const TYPES=['All','Movie','Documentary','Book','Game','Show','Anime','Music','Musical','Other'];
const TOPS=[['movies','Top 4 movies','Movie'],['albums','Top 4 albums','Album'],['books','Top 4 books','Book'],['shows','Top 4 shows','Show'],['games','Top 4 games','Game'],['other','Other faves','Fave']];
const topInputs=(p,t)=>TOPS.map(([k,l,n])=>`<label>${l}</label><div class="row">${[0,1,2,3].map(i=>`<input id="${p}-${k}-${i}" maxlength="60" placeholder="${n} ${i+1}" aria-label="${l} ${i+1}" value="${esc(((t&&t[k])||[])[i]||'')}">`).join('')}</div>`).join('');
const readTops=p=>{const o={};TOPS.forEach(([k])=>{o[k]=[0,1,2,3].map(i=>{const el=document.getElementById(p+'-'+k+'-'+i);return el?el.value.trim():''})});return o};
const topsView=u=>`<section class="panel"><h2>Top 4</h2><div class="tops">${TOPS.map(([k,l])=>{const a=((u.top||{})[k]||[]).filter(Boolean);return `<div class="topcard"><h3>${l.replace('Top 4 ','')}</h3>${a.length?`<ol>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="hint">Nothing picked yet.</p>'}</div>`}).join('')}</div></section>`;
const AVATARS=['🍊','🧡','🟠','🔶','🦊','🐯','🎃','🥕','🏀','🔥','🥭','🐱'];
let db={me:null,profiles:[],posts:[]}, view={n:'feed'}, filter='All', rating=0, sort='new', rev=new Set(), pre=null, dcat='All', dyear='All', clubMsgs=[], feedPosts=[], feedShown=0, feedWant=20, obs=null, pickAv=AVATARS[0], TOKEN='';
try{TOKEN=localStorage.getItem('tg-token')||''}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=id=>db.profiles.find(u=>u.id===id)||{id:'x',name:'Deleted user',handle:'deleted',bio:'',avatar:'🍊'};
const me=()=>db.me?db.profiles.find(u=>u.id===db.me):null;
const postById=id=>db.posts.find(x=>x.id===id)||(db.drafts||[]).find(x=>x.id===id);
const promptOf=id=>(db.prompts||[]).find(x=>x.id===id);
function toast(m){const t=$('tg-toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2300)}
async function api(a,d){
 try{const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify({a,d})});
  const j=await r.json();if(j.error){toast(j.error);return null}
  if(j.token!==undefined){TOKEN=j.token;try{localStorage.setItem('tg-token',TOKEN)}catch(e){}}
  db=j.db;db.me=j.me;db.msgs=j.msgs||[];db.notes=j.notes||[];db.blocked=j.blocked||[];db.admin=!!j.admin;db.reports=j.reports||[];db.email=j.email||'';db.suspended=j.suspended||[];db.clubs=j.clubs||[];db.features=j.features||[];db.owner=!!j.owner;db.admins=j.admins||[];db.members=j.members||[];db.drafts=(db.posts||[]).filter(p=>p.draft);db.posts=(db.posts||[]).filter(p=>!p.draft);db.isCore=!!j.isCore;db.isEditor=!!j.isEditor;db.core=j.core||{};if(j.cmsgs)clubMsgs=j.cmsgs;return j}
 catch(e){toast('Network problem, try again');return null}}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';return Math.round(h/24)+' d ago'}
const excerpt=t=>{t=t.replace(/\s+/g,' ');return t.length>150?t.slice(0,150).trim()+'...':t};
const stars=n=>'🍊'.repeat(n)+'<span style="filter:grayscale(1);opacity:.3">'+'🍊'.repeat(5-n)+'</span>';
const av=(u,c='')=>`<span class="av ${c}" aria-hidden="true">${esc(u.avatar)}</span>`;
const userLink=u=>`<button class="link" data-a="profile" data-id="${u.id}">${av(u,'sm')}${esc(u.name)}</button>`;
const unread=()=>(db.msgs||[]).filter(m=>m.to===db.me&&!m.read).length;
const unreadN=()=>(db.notes||[]).filter(n=>!n.read).length;
const isAdmin=()=>!!db.admin;
const isEd=()=>!!db.isEditor;
const followers=u=>db.profiles.filter(x=>(x.following||[]).includes(u.id)).length;
const fbtn=u=>{const m=me();if(!m||m.id===u.id)return'';const f=(m.following||[]).includes(u.id);return `<button class="btn ${f?'ghost':''}" data-a="follow" data-id="${u.id}">${f?'Unfollow':'Follow'}</button>`};
function go(v,keep){view=v;try{if(keep)history.replaceState({v},'');else history.pushState({v},'')}catch(e){}render();if(!keep){const t=document.getElementById('tg');t.scrollIntoView&&t.scrollIntoView()}}

function bar(){const u=me();
  const nav=`<button class="btn ghost" data-a="feed">Home</button>`;
  const lists=`<button class="btn ghost" data-a="lists">Lists 📋</button><button class="btn ghost" data-a="features">Feature Picks🧺</button><button class="btn ghost" data-a="searchview">Search 🔍</button>`;
  return `<div class="bar">`+(u?`<button class="who" data-a="profile" data-id="${u.id}">${av(u)}${esc(u.handle)}</button>${nav}<button class="btn ghost" data-a="diary" data-id="${u.id}">Diary 📒</button>${lists}<button class="btn ghost" data-a="inbox" aria-label="Messages" title="Messages">✉️${unread()?` (${unread()})`:''}</button><button class="btn ghost" data-a="notes" aria-label="Alerts" title="Alerts">🔔${unreadN()?` (${unreadN()})`:''}</button><button class="btn ghost" data-a="settings" aria-label="Settings" title="Settings">⚙️</button><button class="btn ghost" data-a="logout">Log out</button>`
  :`<button class="btn" data-a="join">Sign up or log in</button>${nav}${lists}`)+`</div>`}

function avPicker(sel){return `<div class="avpick" id="avpick" role="group" aria-label="Pick an avatar">${AVATARS.map(a=>`<button type="button" data-a="pickav" data-v="${a}" aria-pressed="${a===sel}">${a}</button>`).join('')}</div>`}

const igFields=(p,u)=>`<label for="${p}-ig">Instagram (optional)</label><input id="${p}-ig" maxlength="60" placeholder="e.g. ash.reviews" autocapitalize="none" value="${esc((u&&u.insta)||'')}">
 <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="${p}-igp" style="width:auto"${u&&u.igPrivate?' checked':''}>Keep my Instagram private (only I can see it)</label>
 <p class="hint">Optional. It shows on your profile as a social link.</p>
 <label for="${p}-l0">More social links (optional, up to 2)</label><div class="row"><input id="${p}-l0" maxlength="200" placeholder="Letterboxd, Goodreads, Spotify..." value="${esc(((u&&u.links)||[])[0]||'')}"><input id="${p}-l1" maxlength="200" placeholder="Another link" value="${esc(((u&&u.links)||[])[1]||'')}"></div>`;
const readIg=p=>({insta:$(p+'-ig').value.trim(),igPrivate:$(p+'-igp').checked,links:[$(p+'-l0').value.trim(),$(p+'-l1').value.trim()]});
const pronFields=(p,u)=>`<label for="${p}-pr">Pronouns (optional)</label><input id="${p}-pr" maxlength="30" placeholder="e.g. she/her, he/him, they/them" autocapitalize="none" value="${esc(pronStr(u))}"><p class="hint">Optional. Type whatever you like. It shows next to your username.</p>`;
const pronStr=u=>!u?'':Array.isArray(u.pronouns)?u.pronouns.join(' / '):(u.pronouns||'');
const readPron=p=>({pronouns:$(p+'-pr')?$(p+'-pr').value.trim():''});
const pronTxt=u=>pronStr(u)?' · '+esc(pronStr(u)):'';
const host=h=>{try{return new URL(h).hostname.replace(/^www\./,'')}catch(e){return h}};
const profLinks=u=>{const out=[];
 if(u.insta)out.push(`<a class="link" href="https://instagram.com/${esc(u.insta)}" target="_blank" rel="noopener noreferrer nofollow">📷 @${esc(u.insta)}${u.igPrivate?' (private, only you see this)':''}</a>`);
 (u.links||[]).filter(x=>/^https?:\/\//.test(x)).forEach(x=>out.push(`<a class="link" href="${esc(x)}" target="_blank" rel="noopener noreferrer nofollow">🔗 ${esc(host(x))}</a>`));
 return out.length?`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">${out.join('')}</div>`:''};
function joinView(){return `<section class="panel"><h2>Log in</h2>
 <label for="l-handle">Username or email</label><input id="l-handle" maxlength="120" placeholder="e.g. ash_reviews" autocapitalize="none">
 <label for="l-pw">Password</label><input id="l-pw" type="password" autocomplete="current-password">
 <div class="actions"><button class="btn" data-a="loginname">Log in</button><button class="btn ghost" data-a="forgot">Forgot password?</button></div></section>
 <section class="panel"><h2>New here? Create your profile</h2>
 <div class="row"><div><label for="j-name">Display name</label><input id="j-name" maxlength="30" placeholder="e.g. Ash"></div>
 <div><label for="j-handle">Username</label><input id="j-handle" maxlength="20" placeholder="e.g. ash_reviews" autocapitalize="none"></div></div>
 <p class="hint">Username: 3 to 20 letters, numbers or underscores. Each username is unique.</p>
 <label for="j-pw">Password</label><input id="j-pw" type="password" autocomplete="new-password" placeholder="At least 6 characters">
 <label for="j-em">Email</label><input id="j-em" type="email" autocomplete="email" placeholder="you@example.com"><p class="hint">Private: never shown to anyone. You can log in with it and use it to reset your password. One email per account.</p>
 <label for="j-bio">Short bio</label><textarea id="j-bio" maxlength="160" style="min-height:70px" placeholder="What do you love to watch, read or play?"></textarea>
 ${pronFields('j')}
 ${igFields('j')}
 <p class="hint">Optional: add your top 4 picks. You can also add them later.</p>
 ${topInputs('j')}
 <label>Choose an avatar </label>${avPicker(pickAv)}
 <div class="actions"><button class="btn" data-a="create">Create profile</button></div>
 <p class="hint">Your profile is saved online, so you can log in from any device.</p></section>`}

function composeView(){const u=me();
 if(!u)return `<section class="panel"><h2>Write a post</h2><p>Create a profile to publish reviews and blogs.</p><button class="btn" data-a="join">Create a profile</button></section>`;
 return `<section class="panel"><h2>Share a slice as ${esc(u.name)}</h2>${pre&&pre.prompt?`<p class="hint">Replying to the weekly prompt: <b>${esc(pre.ptitle)}</b></p>`:''}

function memberRows(q){q=q.trim().toLowerCase().replace(/^@/,'');
 const posts={},likes={},fol={},ext={};
 db.posts.forEach(p=>{posts[p.by]=(posts[p.by]||0)+1;likes[p.by]=(likes[p.by]||0)+p.likedBy.length});
 db.profiles.forEach(x=>(x.following||[]).forEach(i=>{fol[i]=(fol[i]||0)+1}));
 (db.members||[]).forEach(m=>{ext[m.id]=m});
 const day=t=>t?new Date(t).toISOString().slice(0,10):'';
 return db.profiles.filter(u=>!q||u.handle.includes(q)||u.name.toLowerCase().includes(q)).map(u=>{const m=ext[u.id]||{},ig=u.insta||m.insta||'';
  const links=[ig?'https://instagram.com/'+ig:''].concat((u.links||[]).filter(Boolean)).join(', ');
  return {u,handle:u.handle,name:u.name,email:m.email||'',made:day(m.joined),posts:posts[u.id]||0,likes:likes[u.id]||0,followers:fol[u.id]||0,following:(u.following||[]).length,susp:(m.everSuspended||(db.suspended||[]).includes(u.id))?'Yes':'No',links}})}

 else if(a==='setpick'){if(await api('setpick',{type:g('fp-t'),media:g('fp-m'),note:g('fp-n')})){toast('Fresh pick saved');render()}}
 else if(a==='clearpick'){if(await api('setpick',{})){toast('Fresh pick removed');render()}}
 else if(a==='pickreview'){pre={type:db.pick.type,media:db.pick.media};rating=0;go({n:'feed'})}
 else if(a==='notes'){go({n:'notes'});api('readnotes').then(()=>refreshBar())}
 else if(a==='settings')go({n:'settings'});
 else if(a==='reveal'){rev.add(id);const y=window.scrollY;render();window.scrollTo(0,y)}
 else if(a==='replyto')go({n:'post',id:view.id,rp:+b.dataset.i},true);
 else if(a==='sendr'){const t=g('r-t');if(!t){toast('Write a reply first');return}if(await api('reply',{id,i:+b.dataset.i,t})){go({n:'post',id},true);toast('Reply posted')}}
 else if(a==='delr'){if(!confirm('Delete this reply?'))return;if(await api('delreply',{id,i:+b.dataset.i,j:+b.dataset.j}))go({n:'post',id},true)}
 else if(a==='report'){const reason=prompt('Why are you reporting this? (optional)');if(reason===null)return;
  if(await api('report',{k:b.dataset.k,id,i:b.dataset.i===undefined?undefined:+b.dataset.i,reason}))toast('Thanks, your report was sent')}
 else if(a==='block'){const un=b.textContent==='Unblock';
  if(!un&&!confirm('Block this person? You will no longer see their posts or messages, and they will no longer see yours.'))return;
  if(await api('block',{id})){toast(un?'Unblocked':'Blocked');go({n:un?'settings':'feed'})}}
 else if(a==='changepw'){const n=$('pw-n').value;if(n.length<6){toast('New password needs at least 6 characters');return}
  if(await api('changepw',{old:$('pw-o').value,pw:n})){$('pw-o').value='';$('pw-n').value='';toast('Password changed')}}
 else if(a==='delacct'){if(!confirm('Delete your account forever? This cannot be undone.'))return;
  if(await api('deleteaccount',{pw:$('da-pw').value})){toast('Account deleted');go({n:'feed'})}}
 else if(a==='dismissr'){if(await api('dismissreport',{id}))render()}
 else if(a==='editp'){rating=p.rating;go({n:'post',id,edit:true})}
 else if(a==='editc')go({n:'post',id:view.id,ec:+b.dataset.i},true);
 else if(a==='savec'){const t=g('ce-t');if(!t){toast('Comment cannot be empty');return}if(await api('editcomment',{id,i:+b.dataset.i,t})){go({n:'post',id},true);toast('Comment updated')}}
 else if(a==='savepost'){const dr=b.dataset.draft==='1',d={id,type:g('f-type'),media:g('f-media'),rating,text:g('f-text'),spoiler:$('f-spoil').checked,draft:dr};
  d.title=p&&p.title&&p.title!==p.media?p.title:d.media;
  if(dr?!d.media:(!d.media||!d.text)){toast(dr?'Add a media title first':'Add a media title and your review first');return}
  if(p&&p.draft&&!dr&&!rating){toast('Pick a star rating first');return}
  const was=p&&p.draft;
  if(await api('editpost',d)){rating=0;toast(dr?'Draft saved':was?'Published! 🍊':'Post updated');go({n:'post',id})}}
 else if(a==='savedraft'){if(!needUser())return;
  const d={type:g('f-type'),media:g('f-media'),title:g('f-media'),rating,text:g('f-text'),spoiler:$('f-spoil').checked,draft:true};
  if(!d.media){toast('Add a media title to save a draft');return}
  if(await api('publish',{...d,prompt:pre&&pre.prompt})){pre=null;rating=0;render();toast('Draft saved. Find it on your profile.')}}
 else if(a==='open')go({n:'post',id});
 else if(a==='profile'){const u=user(id);pickAv=u.avatar;go({n:'profile',id})}
 else if(a==='filter'){filter=b.dataset.t;feedWant=20;render()}
 else if(a==='pickav'){pickAv=b.dataset.v;app.querySelectorAll('#avpick button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===pickAv))}
 else if(a==='create'){
  const name=g('j-name'),handle=g('j-handle').toLowerCase().replace(/^@/,''),pw=$('j-pw').value;
  if(!name){toast('Add a display name');return}
  if(!/^[a-z0-9_]{3,20}$/.test(handle)){toast('Username needs 3 to 20 letters, numbers or underscores');return}
  if(pw.length<6){toast('Password needs at least 6 characters');return}
  if(!$('j-em').value.trim()){toast('Add your email');return}
  const r=await api('signup',{...readIg('j'),email:$('j-em').value.trim(),name,handle,pw,bio:g('j-bio'),avatar:pickAv,top:readTops('j'),...readPron('j')});
  if(r){toast('Welcome to the grove, '+name);go({n:'profile',id:r.me})}}
 else if(a==='loginname'){const r=await api('login',{handle:g('l-handle').toLowerCase().replace(/^@/,''),pw:$('l-pw').value});
  if(r){toast('Logged in as '+me().name);go({n:'feed'})}}
 else if(a==='logout'){if(!confirm('Are you sure you want to log out?'))return;await api('logout');toast('Logged out');go({n:'feed'})}
 else if(a==='saveprofile'){if(!me())return;
  if(!g('e-name')){toast('Display name cannot be empty');return}
  const r=await api('saveprofile',{name:g('e-name'),handle:g('e-handle').toLowerCase().replace(/^@/,''),bio:g('e-bio'),avatar:pickAv,top:readTops('e'),...readPron('e'),...readIg('e')});
  if(r){toast('Profile saved');render()}}
 else if(a==='like'){if(!needUser())return;const y=window.scrollY;if(await api('like',{id})){if($('s-res'))$('s-res').innerHTML=searchRes($('s-q').value);else render();window.scrollTo(0,y)}}
 else if(a==='send'){if(!needUser())return;const t=g('c-t');if(!t){toast('Write a comment first');return}
  if(await api('comment',{id,t})){render();toast('Comment posted')}}
 else if(a==='delete'){if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Click again to confirm delete';return}
  if(await api('delete',{id})){toast('Post deleted');go({n:'feed'})}}
 else if(a==='publish'){if(!needUser())return;
  const d={type:g('f-type'),media:g('f-media'),title:g('f-media'),rating,text:g('f-text'),spoiler:$('f-spoil').checked};
  if(!d.media||!d.text){toast('Add a media title and your review first');return}
  if(!rating){toast('Pick a star rating first');return}
  if(await api('publish',{...d,wid:pre&&pre.wid,prompt:pre&&pre.prompt})){pre=null;rating=0;render();toast('Slice shared! 🍊')}}
 else if(a==='follow'){if(!needUser())return;
  if(await api('follow',{id})){if($('s-res'))$('s-res').innerHTML=searchRes($('s-q').value);else render()}}
 else if(a==='prompt')go({n:'prompt',id});
 else if(a==='promptreply'){const k=promptOf(id);if(!k)return;if(!needUser())return;pre={type:'',media:'',prompt:id,ptitle:k.title};rating=0;go({n:'feed'})}
 else if(a==='vote'){if(!needUser())return;const y=window.scrollY;if(await api('pollvote',{id,i:+b.dataset.i,c:b.dataset.c===undefined?undefined:+b.dataset.c})){render();window.scrollTo(0,y)}}
 else if(a==='setbanner'){if(!g('bn-h')){toast('Add a headline first');return}if(await api('setbanner',{title:g('bn-h'),text:g('bn-t')})){toast('Announcement pinned');render()}}
 else if(a==='clearbanner'){if(await api('setbanner',{title:'',text:''})){toast('Announcement removed');render()}}
 else if(a==='newprompt'){if(!g('pr-t')){toast('Write the prompt first');return}if(await api('saveprompt',{id:ed.prompt||undefined,title:g('pr-t'),desc:g('pr-d')})){toast(ed.prompt?'Prompt updated':'Prompt posted');ed.prompt=null;render()}}
 else if(a==='delprompt'){if(!confirm('Delete this prompt? Replies stay as normal posts.'))return;if(await api('delprompt',{id}))render()}
 else if(a==='newpoll'){if(await api('savepoll',{id:ed.poll||undefined,kind:g('po-k'),q:g('po-q'),options:$('po-o').value.split('\n')})){toast(ed.poll?'Updated':'Created');ed.poll=null;render()}}
 else if(a==='editprompt'||a==='editpoll'||a==='editbingo'){ed[a.slice(4)]=id;render();const f=$(a==='editprompt'?'pr-t':a==='editpoll'?'po-q':'bg-t');if(f){f.scrollIntoView({block:'center'});f.focus()}}
 else if(a==='cancelEdit'){ed[b.dataset.k]=null;render()}
 else if(a==='pollclose'){if(await api('pollclose',{id}))render()}
 else if(a==='delpoll'){if(!confirm('Delete this poll?'))return;if(await api('delpoll',{id}))render()}
 else if(a==='addadmin'){const v=$('ad-add')&&$('ad-add').value;if(v&&await api('setadmin',{id:v,on:true})){toast('Admin added');render()}}
 else if(a==='setadmin'){if(!confirm('Remove this admin?'))return;if(await api('setadmin',{id,on:false})){toast('Admin removed');render()}}
 else if(a==='sharefeat'){const url=location.origin+location.pathname+'#feature-'+id,f=feats().find(x=>x.id===id);
  try{if(navigator.share){await navigator.share({title:f.title,url});return}}catch(err){if(err&&err.name==='AbortError')return}
  try{await copyText(url);toast('Link copied')}catch(err){toast(fallbackCopy(url)?'Link copied':url)}}
 else if(a==='bview'){bview=b.dataset.v;const y=window.scrollY;render();window.scrollTo(0,y)}
 else if(a==='bmark'){const y=window.scrollY;if(await api('bingomark',{id,i:+b.dataset.i})){render();window.scrollTo(0,y)}}
 else if(a==='bshare'){if(await api('bingoshare',{id})){toast('Card shared on your profile 🎉');render()}}
 else if(a==='bunshare'){if(await api('bingounshare',{id})){toast('Removed from your profile');render()}}
 else if(a==='newbingo'){if(await api('savebingo',{id:ed.bingo||undefined,title:g('bg-t'),cells:$('bg-c').value.split('\n')})){toast(ed.bingo?'Bingo card updated':'Bingo card created');ed.bingo=null;render()}}
 else if(a==='delbingo'){if(!confirm('Delete this bingo card for everyone?'))return;if(await api('delbingo',{id}))render()}
 else if(a==='copymembers'){const t=membersTsv('');
  try{await copyText(t);toast('Table copied. Paste it into Google Sheets')}catch(err){toast(fallbackCopy(t)?'Table copied. Paste it into Google Sheets':'Could not copy the table')}}
 else if(a==='share'){
  const txt=`${p.title} - a ${p.type.toLowerCase()} review of ${p.media} (${p.rating}/5) by ${user(p.by).name}`;
  try{if(navigator.share){await navigator.share({title:p.title,text:txt});return}}catch(err){if(err&&err.name==='AbortError')return}
  try{await copyText(txt);toast('Copied to clipboard')}catch(err){toast(fallbackCopy(txt)?'Copied to clipboard':'Could not copy the post')}}
});
const tb=$('theme-btn');
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintTheme(){const d=curTheme()==='dark';tb.textContent=d?'☀️ Light mode':'🌙 Dark mode';tb.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')}
tb.addEventListener('click',()=>{const n=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('bb-theme',n)}catch(e){}paintTheme()});
paintTheme();
api('state').then(()=>{const h=location.hash;if(h.startsWith('#reset='))view={n:'reset',token:h.slice(7)};else if(h.startsWith('#list-'))view={n:'list',id:h.slice(6)};else if(h==='#feature-picks')view={n:'features'};else if(h.startsWith('#feature-'))view={n:'feat',id:h.slice(9)};render();try{history.replaceState({v:view},'')}catch(e){}});
let tick=0;setInterval(()=>{if(document.hidden||!me())return;if(view.n!=='chat'&&view.n!=='club'&&++tick%3)return;
 if(view.n==='chat'){const id=view.id;api('read',{id}).then(r=>{if(r&&view.n==='chat'&&$('m-list')){$('m-list').innerHTML=chatList(id);refreshBar()}})}
 else if(view.n==='club'){const id=view.id;api('club',{id}).then(r=>{if(r&&view.n==='club'&&$('cm-list')){const l=$('cm-list'),atEnd=l.scrollHeight-l.scrollTop-l.clientHeight<60;l.innerHTML=clubList();if(atEnd)l.scrollTop=l.scrollHeight}})}
 else api('state').then(r=>{if(!r)return;if(view.n==='inbox')render();else refreshBar()})},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view.n==='feed')api('state').then(r=>r&&render())});
})();
</script>
