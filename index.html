<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangerine Takes</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/logo.png">
<script>try{var t=localStorage.getItem('bb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,800;9..144,900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--o:#FF8A00;--od:#D95F00;--os:#FFF1E0;--line:#FFD9A8;--ink:#3A2210;--mut:#8A6A4D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1E140C;--o:#FF8A00;--od:#FF9A33;--os:#3A2412;--line:#5C3A1C;--ink:#FFE9D2;--mut:#C9A27F}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#1E140C;--o:#FF8A00;--od:#FF9A33;--os:#3A2412;--line:#5C3A1C;--ink:#FFE9D2;--mut:#C9A27F}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg)}
#tg{background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif;max-width:760px;margin:0 auto;padding:0 18px 40px;min-height:100vh}
#tg *{box-sizing:border-box}
#tg h1,#tg h2,#tg h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.1}
#tg button,#tg input,#tg select,#tg textarea{font:inherit;color:inherit}
#tg :focus-visible{outline:3px solid var(--od);outline-offset:2px}
#tg .top{display:flex;align-items:center;gap:20px;padding:26px 0 14px;flex-wrap:nowrap}
#tg .top .grow{flex:1 1 0;min-width:0}
#tg .themebar{display:flex;justify-content:flex-end;margin:0 0 6px}
#tg .themebar .theme{margin:0;align-self:auto;padding:5px 12px}
#tg.intimes .themebar{display:none}
#tg #tg-s1{display:inline-block;white-space:nowrap}
#tg #tg-s2{display:block}
@media(max-width:520px){#tg .top{gap:12px;padding:16px 0 10px}#tg .logo{width:56px;height:56px;margin-top:4px}#tg .side,#tg .theme{margin-top:10px}}
#tg .top h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;color:var(--od)}
#tg .top p{margin:6px 0 0;color:var(--mut)}
#tg .logo{width:96px;height:96px;flex:none;margin-top:12px;object-fit:contain}
#tg .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
#tg .who{display:flex;align-items:center;gap:8px;background:var(--os);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-weight:700;color:var(--od)}
#tg .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#FFB84D,#FF8A00);flex:none;width:34px;height:34px;font-size:18px}
#tg .av.lg{width:84px;height:84px;font-size:44px}
#tg .av.sm{width:26px;height:26px;font-size:14px}
#tg .panel{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:22px}
#tg .panel h2{font-size:1.25rem;margin-bottom:10px;color:var(--od)}
#tg .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){#tg .row{grid-template-columns:1fr}}
#tg label{display:block;font-size:.85rem;font-weight:700;color:var(--mut);margin:10px 0 4px}
#tg input,#tg select,#tg textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
#tg textarea{min-height:100px;resize:vertical}
#tg textarea.write{min-height:260px;font-size:1.05rem;line-height:1.7;overflow:hidden;padding:14px 16px}
#tg .hint{font-size:.85rem;color:var(--mut);margin:6px 0 0}
#tg .dlist .cm,#tg .dlist .cm b,#tg .dlist .cm .link,#tg .dlist .cm .hint,#tg .dlist .cm .rate{color:var(--od)}
#tg .stars{display:flex;gap:2px}
#tg .stars button{background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--line);padding:0 2px;line-height:1}
#tg .stars button{filter:grayscale(1);opacity:.35}#tg .stars button.on{filter:none;opacity:1}
#tg .avpick{display:flex;flex-direction:column;gap:6px}
#tg .avpick .avrow{display:flex;gap:6px;flex-wrap:wrap}
#tg .avpick button{border:2px solid var(--line);background:var(--bg);border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
#tg .avpick button[aria-pressed="true"]{border-color:var(--o);background:var(--os);box-shadow:0 0 0 2px var(--o)}
#tg .btn{background:var(--o);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
#tg .btn:hover{filter:brightness(1.12)}
#tg .btn.ghost{background:var(--os);color:var(--od)}
#tg .btn.danger{background:var(--bg);color:#B3261E;border:2px solid #F2C4C0}
#tg .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#tg .chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500}
#tg .chip[aria-pressed="true"]{background:var(--o);border-color:var(--o);color:#fff;font-weight:700}
#tg .post{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px;position:relative}
#tg .post>.open,#tg .post>h3{padding-right:52px}
#tg .pmw{position:absolute;top:12px;right:12px;z-index:3}
#tg .pmw.inl{position:relative;top:auto;right:auto;display:inline-block;vertical-align:middle}
#tg .pdots{width:38px;height:38px;min-width:0;padding:0 0 4px;border:2px solid var(--line);border-radius:999px;background:var(--os);color:var(--od);font-size:24px;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center}
#tg .pdots:hover,#tg .pdots[aria-expanded="true"]{background:var(--o);border-color:var(--o);color:#fff}
#tg .pmw.inl .pdots{width:28px;height:28px;font-size:18px;padding-bottom:3px}
#tg .pmenu button.dng{color:#B3261E}
#tg .pmenu{position:absolute;top:100%;right:0;margin-top:4px;min-width:150px;background:var(--bg);border:2px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(217,95,0,.18);padding:4px;z-index:6;display:flex;flex-direction:column}
#tg .pmenu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--ink);white-space:nowrap}
#tg .pmenu button:hover,#tg .pmenu button:focus-visible{background:var(--os);color:var(--od)}
#tg .cform .cspoil{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-size:.92rem;margin:0}
#tg .cform .cspoil input{width:auto;flex:none;margin:0}
#tg .rep-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px;z-index:20}
#tg .rep{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
#tg .rep h3{font-size:20px}
#tg .rep-o{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;font-weight:600}
#tg .rep-o:has(input:checked){border-color:var(--o);background:var(--os)}
#tg .rep-o input{width:auto;flex:none;margin:0}
#tg .rep #rep-d{margin-top:10px}
#tg .post h3{font-size:20px}
#tg .open{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:20px;font-weight:800;line-height:1.15;color:var(--ink);-webkit-tap-highlight-color:rgba(217,95,0,.25)}
#tg .open:hover,#tg .open:active,#tg .open:focus-visible{color:var(--od);text-decoration:underline}
#tg .post .meta .tag,#tg .post .meta.bigtags .tag{font-size:14px;padding:2px 10px}
#tg .post .meta.bigtags{margin:8px 0 0}
#tg .meta{color:var(--mut);font-size:.9rem;margin:8px 0 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#tg .link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:var(--od);display:inline-flex;align-items:center;gap:6px}
#tg .link:hover{text-decoration:underline}
#tg .post .meta .link{font-size:15px}
#tg .tag{background:var(--os);border-radius:999px;padding:1px 10px;font-weight:700;color:var(--od);font-size:.82rem}
#tg .rate{color:var(--o);letter-spacing:2px}
#tg .body{white-space:pre-wrap;max-width:68ch}
#tg .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#tg .act{background:var(--os);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--od)}
#tg .act[aria-pressed="true"]{background:var(--o);color:#fff}
#tg .act[data-a="like"][aria-pressed="true"]{background:var(--os);color:var(--od);box-shadow:inset 0 0 0 2px var(--o)}
#tg .tl.off{filter:grayscale(1);opacity:.55}
#tg .comments{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
#tg .cm{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
#tg .cform{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#tg .cform input{flex:1 1 140px}
#tg .empty{text-align:center;color:var(--mut);padding:24px 0}
#tg .phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#tg .phead h2{font-size:1.8rem;color:var(--od);margin:0}
#tg .stats{display:flex;gap:18px;margin-top:8px;color:var(--mut);flex-wrap:wrap}
#tg .stats b{color:var(--od);font-size:1.15rem}
#tg .stats button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
#tg .stats button:hover,#tg .stats button:focus-visible{text-decoration:underline}
#tg .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#tg .toast.show{opacity:1}
#tg .side{margin-left:auto;align-self:flex-start;margin-top:26px;display:flex;flex-direction:column;gap:8px}
#tg .side .theme{margin:0;text-align:center}
#tg .theme{margin-left:auto;align-self:flex-start;margin-top:26px;background:var(--os);color:var(--od);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
#tg .tops{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
#tg .topcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--os)}
#tg .topcard h3{font-size:1.05rem;color:var(--od);margin-bottom:6px}
#tg .topcard ol{margin:0;padding-left:20px}
#tg .tblwrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;margin-bottom:22px}
#tg .mtable{border-collapse:collapse;width:100%;font-size:.92rem;white-space:nowrap}
#tg .mtable th,#tg .mtable td{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:middle}
#tg .mtable th{background:var(--os);color:var(--od);font-weight:700;position:sticky;top:0}
#tg .mtable tr:last-child td{border-bottom:0}
#tg .mtable th:last-child,#tg .mtable td:last-child{border-right:0}
#tg .mtable .nocopy{user-select:none;-webkit-user-select:none}
#tg .mtable .btn{padding:4px 12px;font-size:.85rem}
#tg .bingo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%}
#tg .bc{display:flex;align-items:center;justify-content:center;text-align:center;min-height:72px;padding:4px 3px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:.7rem;line-height:1.2;font-weight:600;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;min-width:0}
#tg button.bc{cursor:pointer}
#tg .blist{display:grid;gap:6px}
#tg .bl{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;min-height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.3;font-weight:600}
#tg button.bl{cursor:pointer}
#tg .bl .bx{flex:none;width:26px;height:26px;border:2px solid var(--o);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;line-height:1}
#tg .bl .bn{color:var(--mut);font-weight:700}
#tg .bl.on{background:var(--o);border-color:var(--o);color:#3A2210;font-weight:700}
#tg .bl.on .bx{background:#3A2210;border-color:#3A2210;color:#fff}
#tg .bl.on .bn{color:#3A2210}
#tg .bl.free{background:#FFD08A;border-color:#FFD08A;color:#3A2210;font-weight:700}
#tg .bl.free .bx{background:#3A2210;border-color:#3A2210;color:#fff}
#tg .bc{position:relative;overflow:hidden}
#tg .bc .bt{display:block;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;-webkit-hyphens:auto}
#tg .bc.on{background:var(--o);border-color:var(--o);color:#3A2210;font-weight:700}
#tg .bc.free{background:#FFD08A;border-color:#FFD08A;color:#3A2210;font-weight:700}
#tg .bc.on::before{content:"\2713";position:absolute;top:1px;left:4px;font-size:.65rem;line-height:1}
@media(max-width:479px){#tg .bingo{gap:3px}#tg .bc{font-size:clamp(.54rem,2.7vw,.7rem);padding:10px 2px 3px;min-height:68px;border-radius:8px;line-height:1.15}}
@media(min-width:480px){#tg .bingo{gap:6px}#tg .bc{min-height:88px;font-size:.82rem;padding:6px 5px}}
@media(min-width:640px){#tg .bingo{gap:8px}#tg .bc{aspect-ratio:1;min-height:0;font-size:1rem;padding:8px;border-radius:12px}}
#tg .person{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px}
/* badges */
#tg .badge{display:inline-block;background:#D95F00;color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:.78rem;line-height:1.5;margin-left:4px}
#tg .badge:first-child{margin-left:0}
/* The Tangerine Times */
#tg.intimes{max-width:820px}
#tg.intimes .top{display:none}
#tg a.btn{display:inline-block;text-decoration:none}
#tg .tt-mast{background:var(--o);color:#3A2210;margin:0 -18px;padding:14px 18px 26px;box-shadow:0 0 0 100vmax var(--o);clip-path:inset(-100vmax -100vmax 0 -100vmax)}
#tg .tt-mast>*:not(.tt-fl){position:relative;z-index:1}
#tg .tt-fl{position:absolute;z-index:0;pointer-events:none;opacity:.22;font-size:2.4rem;animation:ttfloat 7s ease-in-out infinite}
#tg .tt-fl.f1{right:7%;top:12%}
#tg .tt-fl.f2{right:24%;bottom:22%;font-size:1.6rem;animation-delay:-2.5s}
#tg .tt-fl.f3{right:44%;top:9%;font-size:1.2rem;animation-delay:-4.5s}
@keyframes ttfloat{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(10deg)}}
#tg .tt-bk{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:14px}
#tg .tt-bbtns{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px}
#tg .tt-mast :focus-visible{outline-color:#3A2210}
#tg .tt-back{background:none;border:0;padding:6px 0;cursor:pointer;font-weight:700;color:#3A2210;text-decoration:underline;text-underline-offset:3px}
#tg .tt-mast h1{font-family:"Fraunces","Bricolage Grotesque",Georgia,serif;font-weight:900;font-size:clamp(2.5rem,10vw,4.8rem);letter-spacing:-.02em;line-height:.95;margin:20px 0 10px;color:#3A2210}
#tg .tt-mast p{margin:0;max-width:42ch;font-weight:500}
#tg .tt-nav{position:relative;display:flex;gap:2px 22px;flex-wrap:wrap;margin:0 0 28px;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
#tg .tt-nav button{background:none;border:0;border-bottom:5px solid transparent;padding:10px 0 9px;cursor:pointer;font-weight:700;font-size:1rem;line-height:1.2;color:var(--mut);transition:color .2s}
#tg .tt-nav button[aria-current="true"]{color:var(--ink)}
#tg .tt-ind{position:absolute;left:0;top:0;height:5px;background:#FF8A00;transition:transform .35s cubic-bezier(.3,.7,.2,1),width .35s cubic-bezier(.3,.7,.2,1);pointer-events:none}
#tg .tt-slide{animation:ttslide .34s cubic-bezier(.2,.7,.2,1)}
@keyframes ttslide{from{opacity:0;transform:translateX(var(--dx,28px))}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#tg .tt-slide{animation:none}#tg .tt-ind{transition:none}}
#tg .tt-soon{padding:4px 0 24px}
#tg .tt-soon h2{font-family:"Fraunces","Bricolage Grotesque",Georgia,serif;font-weight:900;font-size:clamp(1.9rem,6vw,2.9rem);letter-spacing:-.01em;line-height:1.05;color:var(--ink);margin:0 0 16px;max-width:20ch}
#tg .tt-soon p{max-width:58ch;font-size:1.05rem}
#tg .tt-join{margin:26px 0 8px;border-left:8px solid var(--o);padding:4px 0 4px 16px}
#tg .tt-join p{margin:0 0 10px}
#tg .hb{position:relative;overflow:hidden;border-radius:18px;margin:10px -8px 14px;padding:18px 22px 10px;min-height:250px;display:flex;flex-direction:column;background:linear-gradient(135deg,#FFDDB0,#FFC78A);color:#D95F00}
#tg .hb>*{position:relative;z-index:1}
#tg .hb>.tt-fl{position:absolute;z-index:0}
#tg .hb .tt-fl{font-size:2.4rem;opacity:.9}
#tg .hb .tt-fl.f2{font-size:1.6rem}
#tg .hb .tt-fl.f3{font-size:1.2rem}
#tg .hb-v{flex:1;overflow:hidden;display:flex;touch-action:pan-y}
#tg .hb-t{display:flex;flex:1 0 100%;min-width:100%;transition:transform .3s ease-out;will-change:transform}
#tg .hb-s{flex:0 0 100%;box-sizing:border-box;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
#tg .hb-k{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
#tg .hb h2{font-family:"Fraunces","Bricolage Grotesque",Georgia,serif;font-weight:900;font-size:clamp(1.9rem,8vw,3.2rem);line-height:1;letter-spacing:-.02em;margin:6px 0 8px;color:#D95F00;max-width:12ch}
#tg .hb p{margin:0;max-width:40ch;font-weight:500;font-size:.98rem}
#tg .hb .btn{margin:14px 0 0;background:#D95F00;color:#fff;border-color:#D95F00}
#tg .hb-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
#tg .hb-bar>button{background:none;border:0;font-size:1.3rem;font-weight:800;color:#D95F00;cursor:pointer;padding:4px 10px}
#tg .hb-bar>.hb-ed{font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
#tg .hb-dots{display:flex;align-items:center;gap:8px}
#tg .hb-dots button{width:10px;height:10px;min-width:0;min-height:0;padding:0;margin:0;border:0;border-radius:999px;background:rgba(217,95,0,.3);cursor:pointer;transition:width .25s,background-color .25s}
#tg .hb-dots button[aria-current="true"]{width:26px;background:#D95F00}
@media(prefers-reduced-motion:reduce){#tg .tt-fl{animation:none}#tg .hb-t,#tg .hb-s>*,#tg .hb .btn,#tg .hb-bar>button,#tg .hb-dots button{transition:none}#tg .hb-s>*{opacity:1;transform:none}}
#tg .tt-promo{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--os);border-color:var(--o)}
#tg .tt-pn{font-family:"Fraunces","Bricolage Grotesque",Georgia,serif;font-weight:900;font-size:1.6rem;line-height:1.05}
#tg .tt-card{display:grid;gap:12px;padding-bottom:24px;margin-bottom:24px;border-bottom:2px solid var(--line)}
#tg .tt-img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:var(--os)}
#tg .tt-imgb{display:block;width:100%;padding:0;margin:0;border:0;background:none;cursor:pointer;border-radius:14px;box-shadow:none}
#tg .tt-card h3,#tg .tt-h{font-family:"Fraunces","Bricolage Grotesque",Georgia,serif;font-weight:900;line-height:1.08;letter-spacing:-.01em;margin:4px 0 8px}
#tg .tt-card h3{font-size:clamp(1.4rem,4.5vw,1.9rem)}
#tg .tt-h{font-size:clamp(1.9rem,6vw,2.8rem);margin:6px 0 10px;color:var(--ink)}
#tg .tt-card h3 button{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:none}

<body>

<div id="tg">
  <header class="top">
    <img class="logo" src="/logo.png" alt="Tangerine Takes logo" width="96" height="96">
    <div class="grow"><h1>Tangerine Takes</h1><p id="tg-sub"><span id="tg-s1">Fresh takes, honest reviews, juicy conversation.</span><span id="tg-s2">Sign up, post your takes, and share what you watch, read and play.</span></p></div>
  </header>
  <div class="themebar"><button class="theme" id="theme-btn" type="button"></button></div>
  <div id="tg-app"><p class="empty">Loading...</p></div>
  <div class="toast" id="tg-toast" role="status"></div>
</div>

<script>
(function(){
const app=document.getElementById('tg-app');
const TYPES=['All','Movie','Documentary','Book','Game','Show','Anime','Music','Musical','Internet','Other'];
const TOPS=[['movies','Top 4 movies','Movie'],['albums','Top 4 albums','Album'],['books','Top 4 books','Book'],['shows','Top 4 shows','Show'],['games','Top 4 games','Game'],['other','Other faves','Fave']];
const topInputs=(p,t)=>TOPS.map(([k,l,n])=>`<label>${l}</label><div class="row">${[0,1,2,3].map(i=>`<input id="${p}-${k}-${i}" maxlength="60" placeholder="${n} ${i+1}" aria-label="${l} ${i+1}" value="${esc(((t&&t[k])||[])[i]||'')}">`).join('')}</div>`).join('');
const readTops=p=>{const o={};TOPS.forEach(([k])=>{o[k]=[0,1,2,3].map(i=>{const el=document.getElementById(p+'-'+k+'-'+i);return el?el.value.trim():''})});return o};
const topsView=u=>`<section class="panel"><h2>Top 4</h2><div class="tops">${TOPS.map(([k,l])=>{const a=((u.top||{})[k]||[]).filter(Boolean);return `<div class="topcard"><h3>${l.replace('Top 4 ','')}</h3>${a.length?`<ol>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="hint">Nothing picked yet.</p>'}</div>`}).join('')}</div></section>`;
const ABOUT_INSTA='thetangerinetakes'; /* put your Instagram username here */
const ABOUT_EMAIL='tangerinetakes@gmail.com';
const AVATAR_ROWS=[['🍊','🥕','🥭','🍍','🍌','🥨','🍕','🦊','🐯','🐱'],['🦧','🔥','🐦‍🔥','🍂','🌞','🌄','🌇','🏜️','🧡','🎃'],['🏀','📙','✏️','✨','🎨']],AVATARS=AVATAR_ROWS.flat();
let psort='new';
const sortPosts=(l,k)=>{l=l.slice();if(k==='old')l.sort((a,b)=>a.ts-b.ts);else if(k==='liked')l.sort((a,b)=>b.likedBy.length-a.likedBy.length||b.ts-a.ts);else if(k==='comm')l.sort((a,b)=>b.comments.length-a.comments.length||b.ts-a.ts);else l.sort((a,b)=>b.ts-a.ts);return l};
let db={me:null,profiles:[],posts:[]}, view={n:'feed'}, filter='All', rating=0, sort='new', rev=new Set(), pre=null, dcat='All', dyear='All', clubMsgs=[], feedPosts=[], feedShown=0, feedWant=20, obs=null, pickAv=AVATARS[0], TOKEN='';
try{TOKEN=localStorage.getItem('tg-token')||''}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=id=>db.profiles.find(u=>u.id===id)||{id:'x',name:'Deleted user',handle:'deleted',bio:'',avatar:'🍊'};
const me=()=>db.me?db.profiles.find(u=>u.id===db.me):null;
const postById=id=>db.posts.find(x=>x.id===id)||(db.drafts||[]).find(x=>x.id===id);
const promptOf=id=>(db.prompts||[]).find(x=>x.id===id);
function toast(m){const t=$('tg-toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2300)}
async function api(a,d){
 try{const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify({a,d})});
  const j=await r.json();if(j.error){toast(j.error);return null}
  if(j.token!==undefined){TOKEN=j.token;try{localStorage.setItem('tg-token',TOKEN)}catch(e){}}
  db=j.db;db.me=j.me;db.msgs=j.msgs||[];db.notes=j.notes||[];db.blocked=j.blocked||[];db.admin=!!j.admin;db.reports=j.reports||[];db.email=j.email||'';db.suspended=j.suspended||[];db.clubs=j.clubs||[];db.features=j.features||[];db.owner=!!j.owner;db.admins=j.admins||[];db.mod=!!j.mod;db.mods=j.mods||[];db.members=j.members||[];db.drafts=(db.posts||[]).filter(p=>p.draft);db.posts=(db.posts||[]).filter(p=>!p.draft);db.isCore=!!j.isCore;db.isEditor=!!j.isEditor;db.canWrite=!!j.canWrite;db.core=j.core||{};if(j.cmsgs)clubMsgs=j.cmsgs;return j}
 catch(e){toast('Network problem, try again');return null}}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';return Math.round(h/24)+' d ago'}
const excerpt=t=>{t=plainLk(t).replace(/\s+/g,' ');return t.length>150?t.slice(0,150).trim()+'...':t};
const stars=n=>'🍊'.repeat(n)+'<span style="filter:grayscale(1);opacity:.3">'+'🍊'.repeat(5-n)+'</span>';
const av=(u,c='')=>`<span class="av ${c}" aria-hidden="true">${esc(u.avatar)}</span>`;
const CREW=['Editorial','Team'];
const badgeHtml=u=>u&&u.crew?`<span class="badge" title="Official Tangerine Takes staff">🍊 ${u.crew==='Editorial'?'Editorial':'Team'}</span>`:'';
const userLink=u=>`<button class="link" data-a="profile" data-id="${u.id}">${av(u,'sm')}${esc(u.name)}</button>${badgeHtml(u)}`;
const unread=()=>(db.msgs||[]).filter(m=>m.to===db.me&&!m.read).length;
const unreadN=()=>(db.notes||[]).filter(n=>!n.read).length;
const isAdmin=()=>!!db.admin;
const isLead=()=>!!db.owner;
const isMod=()=>!!db.mod;
const isEd=()=>!!db.isEditor;
const followers=u=>db.profiles.filter(x=>(x.following||[]).includes(u.id)).length;
const fbtn=u=>{const m=me();if(!m||m.id===u.id)return'';const f=(m.following||[]).includes(u.id);return `<button class="btn ${f?'ghost':''}" data-a="follow" data-id="${u.id}">${f?'Unfollow':'Follow'}</button>`};
function go(v,keep){view=v;menuOpen='';try{const u=pathOf(v);if(keep){u?history.replaceState({v},'',u):history.replaceState({v},'')}else{u?history.pushState({v},'',u):history.pushState({v},'')}}catch(e){}if(!keep&&v.n!=='times'){app.classList.remove('vin');void app.offsetWidth;app.classList.add('vin');clearTimeout(go.t);go.t=setTimeout(()=>app.classList.remove('vin'),650)}render();if(!keep){const t=document.getElementById('tg');t.scrollIntoView&&t.scrollIntoView()}}

function bar(){const u=me();
  const nav=`<button class="btn ghost" data-a="feed">Home</button>`;
  const lists=`<button class="btn ghost" data-a="lists">Lists 📋</button><button class="btn ghost" data-a="features">Feature Picks🧺</button><button class="btn ghost" data-a="searchview">Search 🔍</button>`;
  return `<div class="bar">`+(u?`<button class="who" data-a="profile" data-id="${u.id}">${av(u)}${esc(u.handle)}</button>${nav}<button class="btn ghost" data-a="diary" data-id="${u.id}">Diary 📒</button>${lists}<button class="btn ghost" data-a="inbox" aria-label="Messages" title="Messages">✉️${unread()?` (${unread()})`:''}</button><button class="btn ghost" data-a="notes" aria-label="Alerts" title="Alerts">🔔${unreadN()?` (${unreadN()})`:''}</button><button class="btn ghost" data-a="settings" aria-label="Settings" title="Settings">⚙️</button><button class="btn ghost" data-a="logout">Log out</button>`
  :`<button class="btn" data-a="join">Sign up or log in</button>${nav}${lists}`)+`</div>`}

function avPicker(sel){return `<div class="avpick" id="avpick" role="group" aria-label="Pick an avatar">${AVATAR_ROWS.map(r=>`<div class="avrow">${r.map(a=>`<button type="button" data-a="pickav" data-v="${a}" aria-pressed="${a===sel}">${a}</button>`).join('')}</div>`).join('')}</div>`}

const igFields=(p,u)=>`<label for="${p}-ig">Instagram (optional)</label><input id="${p}-ig" maxlength="60" placeholder="e.g. lacyreads" autocapitalize="none" value="${esc((u&&u.insta)||'')}">
 <label style="display:flex;align-items:center;gap:8px;font-weight:500"><input type="checkbox" id="${p}-igp" style="width:auto"${u&&u.igPrivate?' checked':''}>Keep my Instagram private (only I can see it)</label>
 <p class="hint">Optional. It shows on your profile as a social link.</p>
 <label for="${p}-l0">More social links (optional, up to 2)</label><div class="row"><input id="${p}-l0" maxlength="200" placeholder="Letterboxd, Goodreads, Spotify..." value="${esc(((u&&u.links)||[])[0]||'')}"><input id="${p}-l1" maxlength="200" placeholder="Another link" value="${esc(((u&&u.links)||[])[1]||'')}"></div>`;
const readIg=p=>({insta:$(p+'-ig').value.trim(),igPrivate:$(p+'-igp').checked,links:[$(p+'-l0').value.trim(),$(p+'-l1').value.trim()]});
const pronFields=(p,u)=>`<label for="${p}-pr">Pronouns (optional)</label><input id="${p}-pr" maxlength="30" placeholder="e.g. she/her, he/him, they/them" autocapitalize="none" value="${esc(pronStr(u))}"><p class="hint">Optional. Type whatever you like. It shows next to your username.</p>`;
const pronStr=u=>!u?'':Array.isArray(u.pronouns)?u.pronouns.join(' / '):(u.pronouns||'');
const readPron=p=>({pronouns:$(p+'-pr')?$(p+'-pr').value.trim():''});
const pronTxt=u=>pronStr(u)?' · '+esc(pronStr(u)):'';
const host=h=>{try{return new URL(h).hostname.replace(/^www\./,'')}catch(e){return h}};
const profLinks=u=>{const out=[];
 if(u.insta)out.push(`<a class="link" href="https://instagram.com/${esc(u.insta)}" target="_blank" rel="noopener noreferrer nofollow">📷 @${esc(u.insta)}${u.igPrivate?' (private, only you see this)':''}</a>`);
 (u.links||[]).filter(x=>/^https?:\/\//.test(x)).forEach(x=>out.push(`<a class="link" href="${esc(x)}" target="_blank" rel="noopener noreferrer nofollow">🔗 ${esc(host(x))}</a>`));
 return out.length?`<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">${out.join('')}</div>`:''};
function joinView(){return `<section class="panel"><h2>Log in</h2>
 <label for="l-handle">Username or email<span style="color:#D64000" aria-hidden="true"> *</span></label><input id="l-handle" maxlength="120" placeholder="e.g. lacyreads" autocapitalize="none">
 <label for="l-pw">Password<span style="color:#D64000" aria-hidden="true"> *</span></label><input id="l-pw" type="password" autocomplete="current-password">
 <div class="actions"><button class="btn" data-a="loginname">Log in</button><button class="btn ghost" data-a="forgot">Forgot password?</button></div></section>
 <section class="panel"><h2>New here? Create your profile</h2>
 <p class="hint" style="margin-top:0"><span style="color:#D64000" aria-hidden="true">*</span> Required</p>
 <div class="row"><div><label for="j-name">Display name<span style="color:#D64000" aria-hidden="true"> *</span></label><input id="j-name" aria-required="true" maxlength="30" placeholder="e.g. Lacy"></div>
 <div><label for="j-handle">Username<span style="color:#D64000" aria-hidden="true"> *</span></label><input id="j-handle" aria-required="true" maxlength="20" placeholder="e.g. lacyreads" autocapitalize="none"></div></div>
 <p class="hint">Username: 3 to 20 letters, numbers or underscores. Each username is unique.</p>
 <label for="j-pw">Password<span style="color:#D64000" aria-hidden="true"> *</span></label><input id="j-pw" aria-required="true" type="password" autocomplete="new-password" placeholder="At least 6 characters">
 <label for="j-em">Email<span style="color:#D64000" aria-hidden="true"> *</span></label><input id="j-em" aria-required="true" type="email" autocomplete="email" placeholder="you@example.com"><p class="hint">Your email is saved with your account. It is kept private: never shown to anyone. You can log in with it and use it to reset your password. One email per account.</p>
 <label for="j-bio">Short bio</label><textarea id="j-bio" maxlength="160" style="min-height:70px" placeholder="What do you love to watch, read or play?"></textarea>
 ${pronFields('j')}
 ${igFields('j')}
 <p class="hint">Optional: add your top 4 picks. You can also add them later.</p>
 ${topInputs('j')}
 <label>Choose an avatar </label>${avPicker(pickAv)}
 <div class="actions"><button class="btn" data-a="create">Create profile</button></div>
 <p class="hint">Your profile is saved online, so you can log in from any device.</p></section>`}

function composeView(){const u=me();
 if(!u)return `<section class="panel"><h2>Write a post</h2><p>Create a profile to publish reviews and blogs.</p><button class="btn" data-a="join">Create a profile</button></section>`;
 return `<section class="panel" id="compose-box"><h2>Share your take as ${esc(u.name)}</h2>${pre&&pre.prompt?`<p style="margin:0 0 6px;padding:8px 12px;background:var(--os);border-radius:10px">💭 You are answering the weekly prompt: <b>${esc(pre.ptitle)}</b></p>`:''}${pre&&pre.pick?`<p style="margin:0 0 6px;padding:8px 12px;background:var(--os);border-radius:10px">🍊 Reviewing the Fresh pick of the week. It shows in the feed, on your profile and in your diary.</p>`:''}
 <div class="row"><div><label for="f-type">Category</label><select id="f-type">${TYPES.slice(1).map(t=>`<option${pre&&pre.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
 <div><label for="f-media">Title</label><input id="f-media" maxlength="80"${pre?` value="${esc(pre.media)}"`:''}></div></div>
 <label>Your rating</label><div class="stars" id="f-stars">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=rating?'on':''}" data-n="${n}" aria-label="${n} stars">🍊</button>`).join('')}</div>
 <label for="f-title">Headline</label><input id="f-title" maxlength="100" placeholder="Give your post a headline (optional)">
 <label for="f-text">Your review or blog</label>${fmtBar('f-text')}<textarea class="write" data-lk id="f-text" maxlength="10000" placeholder="What did you think? Write as much as you like, the box grows with you."></textarea><p class="hint" id="f-count">0 words</p>
 <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f-spoil" style="width:auto">This post contains spoilers</label>
 <div class="actions"><button class="btn" data-a="publish">Post</button><button class="btn ghost" data-a="savedraft">Save as draft</button></div></section>`}

const likersAll=new Set();
let menuOpen='';
const REPORT_REASONS=['Spoiler','Plagiarism','Bullying or harassment','Others'];
const pmenu=(key,items,inl)=>{const o=menuOpen===key;return `<div class="pmw${inl?' inl':''}"><button type="button" class="pdots" data-a="dots" data-id="${key}" aria-label="More options" aria-haspopup="menu" aria-expanded="${o}">\u22ef</button>${o?`<div class="pmenu" role="menu">${items}</div>`:''}</div>`};
function closeReport(){const w=$('tg-rep');if(w){w.remove();const f=closeReport.f;if(f&&document.contains(f))f.focus()}}
function reportDialog(k,id,i){closeReport();closeReport.f=document.activeElement;
 const w=document.createElement('div');w.id='tg-rep';w.className='rep-bg';

   if(ok){closeReport();toast('Thanks, your report was sent')}else btn.disabled=false}});

const likersPanel=p=>{if(!p.likedBy.length)return'';const us=p.likedBy.map(id=>user(id)),all=likersAll.has(p.id),sh=all?us:us.slice(0,2),rest=us.length-sh.length;

 return `<div class="hint" style="margin:8px 0 0;display:flex;flex-wrap:wrap;gap:0 4px;align-items:center">Liked by ${sh.map(nm).join(', ')}${rest>0?` and <button class="link" data-a="likers" data-id="${p.id}" style="${st}">${rest} other${rest===1?'':'s'}</button>`:(all&&us.length>2?` <button class="link" data-a="likers" data-id="${p.id}" style="${st}">Show less</button>`:'')}</div>`};
function actions(p,full){const u=me(),liked=u&&p.likedBy.includes(u.id);

/* Writing boxes work like Word. Bold, italic, underline and strikethrough are saved as hidden [b] [i] [u] [s] tags. Links are saved as [text](https://...). Only http(s) links are shown as links. */
const fmt=s=>{const op={b:0,i:0,u:0,s:0},st=[];s=s.replace(/\[(\/?)([bius])\]/g,(m,c,t)=>{if(!c){op[t]++;st.push(t);return '<'+t+'>'}if(!op[t])return '';op[t]--;const k=st.lastIndexOf(t);if(k>=0)st.splice(k,1);return '</'+t+'>'});return s+st.reverse().map(t=>'</'+t+'>').join('')};
const lkx=t=>{const L=[];t=String(t==null?'':t).replace(/\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)]{1,500})\)/g,(m,x,u)=>{L.push([x,u]);return '\u0001'+(L.length-1)+'\u0002'});
 return fmt(lk(t)).replace(/\u0001(\d+)\u0002/g,(m,i)=>{const q=L[+i];return `<a class="link" href="${esc(q[1])}" target="_blank" rel="noopener noreferrer nofollow">${esc(q[0])}</a>`})};
const staffTxt=l=>(l||[]).map(x=>x.name+(x.role?' | '+x.role:'')).join('\n');
const staffList=l=>`<ul class="crew">${(l||[]).map(x=>{const m=String(x.name).match(/^(.*?)\s+(@[A-Za-z0-9_]{3,20})$/);return `<li><div class="crew-n">${m?`<b>${esc(m[1])}</b> <span class="crew-u">${lk(m[2])}</span>`:`<b>${lk(x.name)}</b>`}</div>${x.role?`<div class="crew-r">${esc(x.role)}</div>`:''}</li>`}).join('')}</ul>`;
const plainLk=t=>String(t==null?'':t).replace(/\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)]{1,500})\)/g,'$1').replace(/\[\/?[bius]\]/g,'');
const fmtBar=id=>`<div class="fmt" role="toolbar" aria-label="Formatting" data-for="${id}"><button type="button" data-a="fmt" data-c="bold" data-for="${id}" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="false"><b>B</b></button><button type="button" data-a="fmt" data-c="italic" data-for="${id}" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button><button type="button" data-a="fmt" data-c="underline" data-for="${id}" title="Underline (Ctrl+U)" aria-label="Underline" aria-pressed="false"><u>U</u></button><button type="button" data-a="fmt" data-c="strikeThrough" data-for="${id}" title="Strikethrough (Ctrl+Shift+X)" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button></div>`;
/* saved text -> what the editor shows */
function mdToRte(md){return String(md||'').split('\n').map(line=>{const L=[];let t=line.replace(/\[([^\]\n]{1,200})\]\((https?:\/\/[^\s)]{1,500})\)/g,(m,x,u)=>{L.push([x,u]);return '\u0001'+(L.length-1)+'\u0002'});
 t=fmt(esc(t)).replace(/\u0001(\d+)\u0002/g,(m,i)=>'<a href="'+esc(L[+i][1])+'">'+esc(L[+i][0])+'</a>');return '<div>'+(t||'<br>')+'</div>'}).join('')}
/* what the editor shows -> saved text */
function rteToMd(root){let o='';const nl=()=>{if(o&&!o.endsWith('\n'))o+='\n'};
 const plain=n=>n.nodeType===3?n.nodeValue:Array.from(n.childNodes).map(plain).join('');
 const BLOCK=/^(DIV|P|LI|UL|OL|H[1-6]|BLOCKQUOTE|PRE)$/;
 function walk(n){
  if(n.nodeType===3){o+=n.nodeValue.replace(/[​\r]/g,'').replace(/ /g,' ');return}
  if(n.nodeType!==1)return;
  const tg=n.tagName;
  if(tg==='BR'){o+='\n';return}
  if(BLOCK.test(tg)){nl();Array.from(n.childNodes).forEach(walk);nl();return}
  if(tg==='A'){const hr=n.getAttribute('href')||'',tx=plain(n).replace(/[\[\]\n​]/g,'');if(/^https?:\/\//i.test(hr)&&tx.trim())o+='['+tx+']('+hr.replace(/\s/g,'%20').replace(/\)/g,'%29')+')';else o+=plain(n).replace(/​/g,'');return}
  const s=n.style||{},fw=String(s.fontWeight||''),td=String(s.textDecorationLine||s.textDecoration||'');let tags='';
  if(tg==='B'||tg==='STRONG'||fw==='bold'||+fw>=600)tags+='b';
  if(tg==='I'||tg==='EM'||s.fontStyle==='italic')tags+='i';
  if(tg==='U'||/underline/.test(td))tags+='u';
  if(tg==='S'||tg==='STRIKE'||tg==='DEL'||/line-through/.test(td))tags+='s';
  const start=o.length;Array.from(n.childNodes).forEach(walk);
  if(tags){const inner=o.slice(start);o=o.slice(0,start)+inner.split('\n').map(x=>x.trim()?tags.split('').map(t=>'['+t+']').join('')+x+tags.split('').reverse().map(t=>'[/'+t+']').join(''):x).join('\n')}}
 Array.from(root.childNodes).forEach(walk);return o.replace(/\n+$/,'')}
function rteSync(r){const ta=$(r.dataset.for);if(!ta)return;ta.value=rteToMd(r);r.classList.toggle('is-empty',!ta.value.trim());ta.dispatchEvent(new Event('input',{bubbles:true}))}
function rteBar(r){const bar=app.querySelector('.fmt[data-for="'+r.dataset.for+'"]');if(!bar)return;bar.querySelectorAll('button').forEach(b=>{let on=false;try{on=document.queryCommandState(b.dataset.c)}catch(e){}b.setAttribute('aria-pressed',on?'true':'false')})}
function rteCmd(id,c){const r=app.querySelector('.rte[data-for="'+id+'"]');if(!r)return;r.focus();document.execCommand(c,false,null);rteSync(r);rteBar(r)}
function initRte(){try{document.execCommand('defaultParagraphSeparator',false,'div')}catch(e){}
 app.querySelectorAll('textarea[data-lk]').forEach(ta=>{if(ta.nextElementSibling&&ta.nextElementSibling.classList.contains('rte'))return;
  const r=document.createElement('div');r.className='rte'+(ta.classList.contains('write')?' big':'');r.contentEditable='true';r.setAttribute('role','textbox');r.setAttribute('aria-multiline','true');r.dataset.for=ta.id;r.dataset.ph=ta.getAttribute('placeholder')||'';
  const lb=document.querySelector('label[for="'+ta.id+'"]');if(lb)r.setAttribute('aria-label',lb.textContent.trim());
  if(ta.style.minHeight)r.style.minHeight=ta.style.minHeight;
  r.innerHTML=mdToRte(ta.value);r.classList.toggle('is-empty',!ta.value.trim());ta.after(r);const bar=app.querySelector('.fmt[data-for="'+ta.id+'"]');if(bar)r.after(bar)})}
function addLink(r){if(!r)return;const sl=getSelection();const rg=sl.rangeCount?sl.getRangeAt(0).cloneRange():null;
 if(!rg||!r.contains(rg.commonAncestorContainer)){toast('Click inside the box first');return}
 const sel=sl.toString().replace(/[\[\]\n]/g,'').trim();
 let u=prompt('Paste the link'+(sel?' for "'+sel.slice(0,40)+'"':'')+':','https://');if(!u)return;u=u.trim();if(!u)return;
 if(!/^https?:\/\//i.test(u))u='https://'+u;
 let host='';try{host=new URL(u).hostname.replace(/^www\./,'')}catch(x){toast('That link does not look right');return}
 u=u.replace(/\s/g,'%20').replace(/\)/g,'%29');
 let txt=sel;if(!txt){txt=(prompt('What should the link say?',host)||'').replace(/[\[\]\n]/g,'').trim()||host}
 r.focus();sl.removeAllRanges();sl.addRange(rg);
 if(sel)document.execCommand('createLink',false,u);else document.execCommand('insertHTML',false,'<a href="'+esc(u)+'">'+esc(txt)+'</a>&#8203;');
 rteSync(r)}

const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pkey=(d,f)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(f==='weekly')x.setDate(x.getDate()-((x.getDay()+6)%7));return dkey(x)};
const pprev=(k,f)=>{const a=k.split('-').map(Number),x=new Date(a[0],a[1]-1,a[2]);x.setDate(x.getDate()-(f==='daily'?1:7));return dkey(x)};

 let best=0;(st.logs||[]).forEach(l=>{if(set.has(pprev(l,st.freq)))return;let n=0,x=l;while(set.has(x)){n++;x=pprevInv(x,st.freq)}best=Math.max(best,n)});

const pprevInv=(k,f)=>{const a=k.split('-').map(Number),x=new Date(a[0],a[1]-1,a[2]);x.setDate(x.getDate()+(f==='daily'?1:7));return dkey(x)};

const tb=$('theme-btn');

tb.addEventListener('click',()=>{const n=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('bb-theme',n)}catch(e){}paintTheme()});
